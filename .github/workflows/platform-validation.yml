name: Windows platform validation

# These OS images require dedicated machines. Manual dispatch also prevents
# unreviewed pull requests from executing on a persistent self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Windows platform with a provisioned self-hosted runner
        type: choice
        options: [Both, Windows11, Server2019]
        default: Both
      architecture:
        description: PowerShell process architectures to validate
        type: choice
        options: [Both, x64, x86]
        default: Both

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.platform }} (${{ inputs.architecture }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'Both' && '["Windows11","Server2019"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: [self-hosted, Windows, X64, "${{ format('stealthprivesc-{0}', matrix.platform) }}"]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate OS identity and run requested architecture matrix
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
          TEST_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          $architectures = if ($env:TEST_ARCHITECTURE -eq 'Both') { @('x64','x86') } else { @($env:TEST_ARCHITECTURE) }
          $options = @{Architecture=$architectures;ExpectedPlatform=$env:TEST_PLATFORM;ResultsDirectory='./TestResults/platform'}
          if ('x86' -in $architectures) {
            $options.PowerShell7X86Path = & ./tools/Get-TestPowerShell.ps1 -Architecture x86 -DestinationDirectory "$env:RUNNER_TEMP/stealthprivesc-runtimes"
          }
          New-Item -ItemType Directory -Path ./TestResults/platform -Force | Out-Null
          & ./tools/Test-Project.ps1 @options 2>&1 | Tee-Object -FilePath ./TestResults/platform/validation.log
          if ($LASTEXITCODE -ne 0) { throw "Validation exited $LASTEXITCODE. See validation.log." }
      - name: Publish actual platform results
        if: always()
        run: |
          $result = Get-Content ./TestResults/platform/validation.json -Raw | ConvertFrom-Json
          "OS: $($result.Platform.Caption), build $($result.Platform.Build). Passed: $($result.Passed)/$($result.Expected); failed: $($result.Failed); not run: $($result.NotRun)." >> $env:GITHUB_STEP_SUMMARY
          if ($result.Passed -ne $result.Expected -or $result.Failed -ne 0 -or $result.NotRun -ne 0) { throw 'Platform validation incomplete.' }
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.platform }}-${{ inputs.architecture }}
          path: TestResults/platform/
          if-no-files-found: error
          retention-days: 14
